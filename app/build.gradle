plugins {
    id 'com.android.application'
}

android {
    namespace 'az.neftcala.xerc'
    compileSdk 34

    defaultConfig {
        applicationId 'az.neftcala.xerc'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
